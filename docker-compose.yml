services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: substation
      MYSQL_USER: gridline
      MYSQL_PASSWORD: gridline
      MYSQL_ROOT_PASSWORD: gridline-root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugridline", "-pgridline"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
